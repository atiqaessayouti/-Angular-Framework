<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Gestion des Produits</h2>
    <button class="btn btn-primary" (click)="addProduct()">+ Nouveau Produit</button>
  </div>

  <div class="input-group mb-3">
    <input type="text" class="form-control" [(ngModel)]="keyword" placeholder="Rechercher..." (keyup.enter)="searchProducts()" />
    <button class="btn btn-success" (click)="searchProducts()">Rechercher</button>
    <button class="btn btn-secondary" (click)="keyword=''; loadProducts()">Reset</button>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <table class="table table-bordered table-hover" *ngIf="products.length > 0">
    <thead class="table-dark">
      <tr>
        <th>ID</th><th>Nom</th><th>Prix</th><th>Quantité</th><th>Disponible</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of products">
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.price | number:'1.2-2' }} DH</td>
        <td>{{ p.quantity }}</td>
        <td>
          <span class="badge" [class.bg-success]="p.available" [class.bg-danger]="!p.available">
            {{ p.available ? 'Oui' : 'Non' }}
          </span>
        </td>
        <td>
          <button class="btn btn-warning btn-sm me-1" (click)="editProduct(p.id!)">Modifier</button>
          <button class="btn btn-danger btn-sm" (click)="deleteProduct(p.id!)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="products.length === 0" class="text-center text-muted">Aucun produit trouvé.</p>
</div>
