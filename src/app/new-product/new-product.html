<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4>{{ editMode ? "Modifier le Produit" : "Nouveau Produit" }}</h4>
        </div>
        <div class="card-body">
          <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
          <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
          <div class="mb-3">
            <label class="form-label">Nom</label>
            <input type="text" class="form-control" [(ngModel)]="product.name" />
          </div>
          <div class="mb-3">
            <label class="form-label">Prix</label>
            <input type="number" class="form-control" [(ngModel)]="product.price" />
          </div>
          <div class="mb-3">
            <label class="form-label">Quantite</label>
            <input type="number" class="form-control" [(ngModel)]="product.quantity" />
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="dispo" [(ngModel)]="product.available" />
            <label class="form-check-label" for="dispo">Disponible</label>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-success" (click)="saveProduct()">{{ editMode ? "Modifier" : "Ajouter" }}</button>
            <button class="btn btn-secondary" (click)="cancel()">Annuler</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
