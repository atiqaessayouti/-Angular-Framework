<div class="container mt-4">
  <h2 class="mb-3">Liste des Produits</h2>
  <div class="row mb-3">
    <div class="col-md-8">
      <div class="input-group">
        <input type="text" class="form-control" [(ngModel)]="keyword" placeholder="Rechercher un produit..." />
        <button class="btn btn-outline-success" (click)="searchProducts()">Chercher</button>
        <button class="btn btn-outline-secondary" (click)="keyword=''; loadProducts()">Reset</button>
      </div>
    </div>
    <div class="col-md-4 text-end">
      <button class="btn btn-primary" (click)="newProduct()">+ Nouveau Produit</button>
    </div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <table class="table table-striped table-bordered align-middle">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Prix</th>
        <th>Quantite</th>
        <th>Disponible</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of products">
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.price | number:"1.2-2" }} DH</td>
        <td>{{ p.quantity }}</td>
        <td>
          <span class="badge" [class.bg-success]="p.available" [class.bg-danger]="!p.available">
            {{ p.available ? "Oui" : "Non" }}
          </span>
        </td>
        <td>
          <button class="btn btn-sm btn-warning me-1" (click)="editProduct(p.id!)">
            Modifier
          </button>
          <button class="btn btn-sm btn-danger" (click)="deleteProduct(p.id!)">
            Supprimer
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="products.length === 0 && !errorMessage" class="text-muted text-center">
    Aucun produit disponible.
  </p>
</div>
